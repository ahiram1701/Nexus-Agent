packages:
  "framer-motion": "For fluid animations on the live thought stream and log entries"
  "date-fns": "For elegant relative and absolute timestamp formatting"
  "lucide-react": "For beautiful, consistent iconography across the dashboard"

images:
  - path: "artifacts/agent-dashboard/public/images/ai-bg.png"
    description: "Abstract, dark, high-end cyberpunk aesthetic with glowing cyan and purple neural network nodes and subtle volumetric lighting"
    aspect_ratio: "16:9"

notes:
  - The UI forces a dark mode premium aesthetic by wrapping the app in a `.dark` container.
  - The agent logs poll every 3 seconds ONLY when the agent config indicates `isRunning` is true.
  - Manual "Run Now" triggers invalidate both the logs and the memory to keep the UI instantly fresh.
